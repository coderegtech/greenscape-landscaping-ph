# Weekly update PRs: keeps the SHA-pinned GitHub Actions and npm dependencies current (security audit, supply chain).
# Every PR runs CI and the Security workflow before it can merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /apps/admin, /apps/employee]
    schedule: { interval: weekly }

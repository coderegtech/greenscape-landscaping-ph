name: CI

on:
  push:
    branches: [main, rebuild/**]
  pull_request:

# Pull requests run this with a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # ~10 min setup and checks, then ~25 min for the e2e suite (desktop + mobile) on a 2-core runner
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dependencies, databases and local Supabase, migrated and seeded (.github/actions/local-stack).
      - uses: ./.github/actions/local-stack

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      # Builds web + admin with the API running (the web app pre-renders pages from the CMS).
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # The web image pre-renders CMS pages, so it is built and scanned here, where the API is reachable
      # (api and admin images are scanned in security.yml). Public values only; no secrets in the build.
      - name: Build web image (API reachable over the host network)
        run: |
          val() { grep "^$1=" .env | cut -d= -f2-; } # .env is not shell-safe to source (URLs contain &)
          NEXT_PUBLIC_SUPABASE_URL=$(val NEXT_PUBLIC_SUPABASE_URL); NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(val NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY)
          pnpm --filter @greenscape/api start > api-image-build.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4000/v1/health/live >/dev/null && break; sleep 2; done
          docker build --network host -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000 --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"             --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" -t greenscape-web:ci .
      - name: Trivy (web image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: greenscape-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

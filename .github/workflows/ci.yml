name: CI

on:
  push:
    branches: [main, rebuild/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env

      # Same compose file as local dev (Mongo needs a replica set, which service containers can't configure).
      - run: pnpm services:up

      # Local Supabase (auth + mail) with a throwaway ES256 signing key, like a hosted project.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: latest
      - run: echo '[]' > supabase/signing_keys.json && supabase gen signing-key --algorithm ES256 --append
      - run: pnpm supabase:start
      - run: pnpm supabase:env

      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm content:indexes
      - run: pnpm content:seed
      - run: pnpm storage:setup

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      # Builds web + admin with the API running (the web app pre-renders pages from the CMS).
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

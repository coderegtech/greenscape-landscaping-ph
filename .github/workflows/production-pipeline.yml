# Keeps the `production` branch: a deployment-only snapshot of main (docs/deployment/production-branch.md,
# docs/deployment/ci-cd-pipeline.md). Runs when CI or Security finishes on a push to main and goes on only when BOTH
# succeeded on that same commit and it is still the head of main. Then: generate the snapshot from the commit, scan it
# for secrets, build and run it on the runner with a smoke test, and publish it as a normal (never forced) commit.
#
# This workflow always runs from main's copy of this file with main's code, never with pull-request code, so its
# write token is not reachable from a pull request.
#
# Switches (repository variables): PRODUCTION_PUBLISH_ENABLED=true lets green pushes publish to `production`;
# DOKPLOY_AUTO_DEPLOY=true also calls the deploy workflow afterwards. Both are off until set.
# A manual run (Actions > Production pipeline > Run workflow, on main) publishes to the branch you name, by default the
# rehearsal branch `production-test`.
name: Production pipeline

on:
  workflow_run:
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to publish to (production, or production-<name> for a rehearsal)
        default: production-test

permissions: {}

# One run at a time, in order; a waiting run is replaced by a newer one. An older run can't finish after a newer one.
concurrency:
  group: production-pipeline
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      ready: ${{ steps.check.outputs.ready }}
      target: ${{ steps.check.outputs.target }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          TARGET: ${{ inputs.target_branch || 'production' }}
        run: |
          skip() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_run ]; then
            # A fork's pull request can come from a branch called main: only a push to this repository's main counts.
            { [ "$RUN_EVENT" = push ] && [ "$RUN_BRANCH" = main ] && [ "$RUN_REPO" = "$GITHUB_REPOSITORY" ]; } || skip "Not a push to main of this repository: nothing to publish."
          elif [ "$REF" != refs/heads/main ]; then
            echo "::error::Run this workflow from main."; exit 1
          fi
          [[ "$TARGET" =~ ^production(-[a-z0-9-]+)?$ ]] || { echo "::error::target_branch must be production or production-<name>"; exit 1; }
          for wf in ci.yml security.yml; do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --commit "$SHA" --event push --limit 1 --json conclusion --jq '.[0].conclusion // "missing"')
            [ "$result" = success ] || skip "$wf is '${result:-still running}' on $SHA: not publishing (both CI and Security must succeed on the same commit)."
          done
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [ "$head" = "$SHA" ] || skip "main is now at $head: $SHA is superseded, the newer commit's run publishes."
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "CI and Security succeeded on $SHA (head of main): continuing to \`$TARGET\`." >> "$GITHUB_STEP_SUMMARY"

  # The snapshot is generated from the commit in git, so every job that needs it generates the identical folder again.
  snapshot:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0 # the generator checks that the commit is on origin/main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Generate and validate the snapshot
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          node scripts/generate-production-snapshot.ts --commit "$SHA" --out "$RUNNER_TEMP/snapshot" | tee inventory.txt
          { echo '```'; cat inventory.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Gitleaks (snapshot files)
        run: >
          docker run --rm -v "$RUNNER_TEMP/snapshot:/snapshot:ro" -v "$PWD/.gitleaks.toml:/gitleaks.toml:ro"
          zricethezav/gitleaks:v8.21.2 detect --no-git --source /snapshot --config /gitleaks.toml --redact

  # Staging on the runner: throwaway databases and a local Supabase, the four images built from the snapshot and
  # started in production mode, then the smoke test. Nothing here can reach a real environment (no secrets).
  staging:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/local-stack
      - name: Generate the snapshot
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: node scripts/generate-production-snapshot.ts --commit "$SHA" --out "$RUNNER_TEMP/snapshot"

      - name: Build and start the API from the snapshot (migrations first)
        working-directory: ${{ runner.temp }}/snapshot
        run: |
          docker build -f apps/api/Dockerfile -t greenscape-api:snapshot .
          docker build -f apps/api/Dockerfile --target migrate -t greenscape-migrate:snapshot .
          # Already migrated by the stack setup: this proves the snapshot's migrations match and the job image runs.
          docker run --rm --network host --env-file "$GITHUB_WORKSPACE/.env" greenscape-migrate:snapshot
          docker run -d --name api --network host --env-file "$GITHUB_WORKSPACE/.env" -e NODE_ENV=production greenscape-api:snapshot
          for i in $(seq 1 60); do curl -sf http://localhost:4000/v1/health >/dev/null && exit 0; sleep 2; done
          echo "::error::the API from the snapshot did not become healthy"; exit 1
      - name: Build and start the website, admin and employee portal from the snapshot
        working-directory: ${{ runner.temp }}/snapshot
        run: |
          val() { grep "^$1=" "$GITHUB_WORKSPACE/.env" | cut -d= -f2-; } # .env is not shell-safe to source (URLs contain &)
          for app in web admin employee; do
            docker build --network host -f "apps/$app/Dockerfile" \
              --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000 --build-arg NEXT_PUBLIC_SUPABASE_URL="$(val NEXT_PUBLIC_SUPABASE_URL)" \
              --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$(val NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY)" -t "greenscape-$app:snapshot" .
            docker run -d --name "$app" --network host --env-file "$GITHUB_WORKSPACE/.env" -e NODE_ENV=production "greenscape-$app:snapshot"
          done
          for port in 3000 3001 3002; do
            for i in $(seq 1 60); do curl -sf "http://localhost:$port/api/health" >/dev/null && continue 2; sleep 2; done
            echo "::error::the app on port $port did not become healthy"; exit 1
          done

      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test the running snapshot
        run: pnpm exec playwright test -c playwright.smoke.config.ts
        env:
          CI: 'true'
      - name: Container logs (on failure)
        if: failure()
        run: for c in api web admin employee; do echo "::group::$c"; docker logs --tail 80 "$c" 2>&1 || true; echo "::endgroup::"; done

  publish:
    needs: [gate, snapshot, staging]
    if: needs.gate.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || vars.PRODUCTION_PUBLISH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # pushes the snapshot commit to the production branch; nothing else in this workflow can write
    outputs:
      published: ${{ steps.push.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: push
        name: Publish the snapshot (fast-forward only)
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          TARGET: ${{ needs.gate.outputs.target }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/generate-production-snapshot.ts --commit "$SHA" --out "$RUNNER_TEMP/snapshot"
          bash scripts/publish-production-snapshot.sh "$RUNNER_TEMP/snapshot" "$SHA" "$TARGET" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [gate, publish]
    if: needs.publish.outputs.published != '' && needs.gate.outputs.target == 'production' && vars.DOKPLOY_AUTO_DEPLOY == 'true'
    permissions: {}
    uses: ./.github/workflows/deploy-production.yml
    secrets:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}

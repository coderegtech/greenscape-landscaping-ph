# Security checks (docs/security/security-testing.md). Runs on every push and pull request and weekly (new advisories
# appear without code changes). A high or critical finding fails the job; exceptions follow the documented process in
# docs/security/security-checklist.md (written approval + expiry in osv-scanner.toml / .trivyignore / .gitleaks.toml).
name: Security

on:
  push:
    branches: [main, 'rebuild/**', 'security/**']
  pull_request:
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production dependencies, fail on high/critical)
        run: pnpm audit --prod --audit-level=high --json > pnpm-audit.json || (cat pnpm-audit.json; exit 1)
      - name: OSV-Scanner (lockfile)
        run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v1.9.2 --config /src/osv-scanner.toml --format json --output /src/osv.json --lockfile /src/pnpm-lock.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-reports
          path: |
            pnpm-audit.json
            osv.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact --report-format sarif --report-path /repo/gitleaks.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: gitleaks-report, path: gitleaks.sarif }

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep (TypeScript, Node, OWASP Top 10, project rules)
        run: >
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.95.0 semgrep scan
          --config p/typescript --config p/nodejs --config p/owasp-top-ten --config .semgrep.yml
          --severity ERROR --error --sarif --output semgrep.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: semgrep-report, path: semgrep.sarif }

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one image's findings should not hide the others'
      matrix:
        include:
          - { app: api, dockerfile: api.Dockerfile, args: '' }
          - { app: web, dockerfile: next.Dockerfile, args: '--build-arg APP=web --build-arg PORT=3000 --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci' }
          - { app: admin, dockerfile: next.Dockerfile, args: '--build-arg APP=admin --build-arg PORT=3001 --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build ${{ matrix.app }} image (no secrets in the build)
        run: docker build -f docker/${{ matrix.dockerfile }} ${{ matrix.args }} -t greenscape-${{ matrix.app }}:ci .
      - name: Trivy (OS and library vulnerabilities, misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0 (0.28.0 used a setup-trivy tag that no longer exists)
        with:
          image-ref: greenscape-${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: 'trivy-${{ matrix.app }}', path: 'trivy-${{ matrix.app }}.sarif' }
